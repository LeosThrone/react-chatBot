<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


        function ChatInput({ messages, setMessages }){

            const [inputText,setInputText] = React.useState('');
            const[loading,setLoading] = React.useState(false);

            function storgeInput(event){
                setInputText(event.target.value);
            }

            async function sendMessage(){

                if(loading || inputText === ''){
                    return;
                }

                setLoading(true);
                setInputText('');

                const newMessages = [...messages,{
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()
                    }];

                setMessages(
                    [...newMessages,{
                        message: 'Loading...',
                        sender:'robot',
                        id: crypto.randomUUID()
                    }]
                )
                

                const response = await (Chatbot.getResponseAsync(inputText));

                setMessages(
                    [...newMessages,{
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }]
                )


                
                setLoading(false);
            }

            function keyDown(event){
                if(event.key === "Enter"){
                    sendMessage();
                }

                if(event.key === 'Esc' || event.key === 'Escape'){
                    setInputText('');
                }
            }

            return (
                <>
                    <input 
                        size="30"
                        placeholder="Send a message to Chatbot"
                        onChange={storgeInput}
                        value={inputText}
                        onKeyDown={keyDown}
                    />
                    <button onClick={sendMessage}>Send</button>
                </>
            );
        }

        function ChatMessage({message,sender}){
            return(
                <div>
                    {sender === "robot" &&
                        (
                            <img 
                                src="./assets/robot.png" 
                                width="50" 
                            />
                        )
                    }

                    {message}

                    {sender === "user" &&
                        (
                            <img 
                                src="./assets/user.png" 
                                width="50" 
                            />
                        )
                    }
                </div>
            );
        }

        function ChatMessages({ messages }){
            return(
                messages.map((message)=>{
                    return(
                        <ChatMessage 
                            message={message.message}
                            sender={message.sender}
                            key={message.id}
                        />
                    );
                })

            );

        }
        

        function App(){

            const [messsages, setMessages] = React.useState([{
                message: 'hello chatbot',
                sender: 'user',
                id: 'id1'  
            },{
                message: 'Hello! How can I help you?',
                sender: 'robot',
                id: 'id2'
            },{
                message: 'what is todays date??',
                sender: 'user',
                id: 'id3'
            },{
                message: 'Today is October 26',
                sender: 'robot',
                id: 'id4'
            }])


            return (
                <>
                  <ChatInput 
                    messages={messsages}
                    setMessages={setMessages}
                  />
                  <ChatMessages 
                    messages= {messsages}
                  />
                </>
            );
        }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container).render(<App />);
      
    </script>
  </body>
</html>
